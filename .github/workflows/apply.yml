name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/APPLY"

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: eticket-app-repo

jobs:
  apply:
    name: Build Push Deploy
    runs-on: ubuntu-latest

    steps:

      # ==========================
      # CHECKOUT
      # ==========================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================
      # AWS
      # ==========================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================
      # TERRAFORM
      # ==========================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: terraform
        run: terraform init


      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


      # ==========================
      # ECR LOGIN
      # ==========================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================
      # GET ECR URI
      # ==========================

      - name: Get ECR Repository URI
        run: |
          ECR_URI=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "ECR_URI=$ECR_URI" >> "$GITHUB_ENV"

          echo "ECR URI: $ECR_URI"


      # ==========================
      # DOCKER BUILD
      # ==========================

      - name: Build Docker Image
        run: |
          docker build \
            -t "$ECR_URI:${GITHUB_SHA}" \
            -t "$ECR_URI:latest" \
            .


      # ==========================
      # ECR PUSH
      # ==========================

      - name: Push Docker Image
        run: |
          echo "Pushing version tag: ${GITHUB_SHA}"
          docker push "$ECR_URI:${GITHUB_SHA}"

          echo "Pushing latest tag"
          docker push "$ECR_URI:latest"


      # ==========================
      # TERRAFORM APPLY
      # ==========================

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="image_tag=${GITHUB_SHA}"


      # ==========================
      # ECS DEPLOYMENT
      # ==========================

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster eticket-app-cluster \
            --service eticket-app-service \
            --force-new-deployment \
            --region "$AWS_REGION"


      # ==========================
      # WAIT FOR ECS
      # ==========================

      - name: Wait for ECS Service
        run: |
          aws ecs wait services-stable \
            --cluster eticket-app-cluster \
            --services eticket-app-service \
            --region "$AWS_REGION"


      # ==========================
      # OUTPUT
      # ==========================

      - name: Terraform Outputs
        working-directory: terraform
        run: terraform output